<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b100d"><title>Choose a new password — SOLARA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/auth.js" defer></script>
</head>
<body class="auth-page">
  <a class="auth-back" href="index.html">← Back to SOLARA</a>
  <main class="auth-layout">
    <div class="auth-photo"><div><p class="eyebrow light-eyebrow">SOLARA / ACCOUNT ACCESS</p><h1>A new<br><em>beginning.</em></h1><p>Choose a new password for your SOLARA account.</p></div></div>
    <section class="auth-panel">
      <a class="wordmark" href="index.html">SOLARA<span>®</span></a>
      <div class="auth-form-wrap">
        <p class="section-kicker">ACCOUNT RECOVERY</p><h2>New password</h2><p class="auth-muted">Choose a password with at least 8 characters.</p>
        <form id="updatePasswordForm">
          <label for="newPassword">New password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required>
          <label for="confirmNewPassword">Confirm new password</label><input id="confirmNewPassword" type="password" autocomplete="new-password" minlength="8" required>
          <button class="button auth-submit" type="submit">Save password <span>→</span></button>
          <p class="form-message" id="formMessage" role="status"></p>
        </form>
        <p class="auth-switch"><a href="login.html">Return to login</a></p>
      </div>
    </section>
  </main>
</body>
</html>
